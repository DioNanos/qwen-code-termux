name: 'Documentation issue'
description: 'Report an issue with this fork documentation'
title: 'Docs: [ISSUE]'
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Report only documentation issues in this Termux fork.

  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'What is the problem?'
      description: 'A clear and concise description of what is wrong.'
    validations:
      required: true

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What did you expect to happen?'
    validations:
      required: true
